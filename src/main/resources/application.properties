# ===============================
# Application
# ===============================
spring.application.name=authservice

# ===============================
# Database Connection (PostgreSQL)
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/auth_db}
spring.datasource.username=${DB_USERNAME:mukhlis}
spring.datasource.password=${DB_PASSWORD:password123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# DEV ONLY: create schema on startup (use 'update' later)
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===============================
# Hibernate Schema Control
# ===============================
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Debug (IMPORTANT for your case)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG


# ===============================
# JWT RSA Keys (PEM)
# ===============================
# Provide real keys in production. If empty, keys are generated at startup.
# Example:
# jwt.rsa.private-key=-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----
# jwt.rsa.public-key=-----BEGIN PUBLIC KEY-----\n...\n-----END PUBLIC KEY-----
jwt.rsa.private-key=
jwt.rsa.public-key=

# Optional ID encryption (legacy, unused by default)
jwt.encryption.secret=

# ===============================
# JWT Issuer/Audience
# ===============================
app.auth.issuer=authservice
app.auth.audience=authservice
app.client-assertion.audience=authservice

# OAuth settings
app.auth-code.minutes=5
app.refresh-token.days=30
app.email-verification.minutes=10

server.servlet.context-path=/api/auth-service

# ===============================
# CORS
# ===============================
# Comma-separated list. Use "*" to allow all origins (no credentials).
# Example: app.cors.allowed-origins=http://localhost:4200,https://app.example.com
app.cors.allowed-origins=*
